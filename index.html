<!doctype html>
<html lang="zh-Hant">
<head>

  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WHNEXDJTHH"></script>
<script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e1b4b">
<title>半導體產業快報</title>
<meta name="description" content="每 2 日更新：晶圓代工新聞與重點數據">

<!-- 連結預覽（LINE / Facebook / Slack 等）。爬蟲只看得到這裡的靜態文字 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="半導體產業快報">
<meta property="og:locale" content="zh_TW">
<meta property="og:url" content="https://jasonzhi731.github.io/news-wab/">
<meta property="og:title" content="半導體產業快報">
<meta property="og:description" content="每 2 日更新：晶圓代工新聞與重點數據">
<meta property="og:image" content="https://jasonzhi731.github.io/news-wab/assets/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="半導體產業快報">
<meta name="twitter:description" content="每 2 日更新：晶圓代工新聞與重點數據">
<meta name="twitter:image" content="https://jasonzhi731.github.io/news-wab/assets/og-cover.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='7' fill='%234f46e5'/%3E%3Crect x='10' y='10' width='12' height='12' rx='2' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
<script>
  // 在畫面繪製前套用深淺色，避免閃一下白底
  (function () {
    var t = null;
    try { t = localStorage.getItem('wr-theme'); } catch (e) {}
    if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    document.documentElement.setAttribute('data-theme', t || 'light');
  })();
</script>
</head>
<body>

<div id="drop-veil" hidden><div>放開以載入這份 Excel</div></div>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-text">半導體產業快報</span>
      <span class="brand-cadence">每 2 日更新</span>
    </div>

    <div class="source-picker">
      <label class="sr-only" for="report-select">選擇報告</label>
      <select id="report-select" hidden></select>
      <input id="file-input" type="file" accept=".xlsx,.xlsm,.xls" hidden>
    </div>

    <div class="topbar-tools">
      <button id="btn-theme" class="btn icon" type="button" title="切換深色 / 淺色">◐</button>
    </div>
  </div>
</header>

<main id="app" class="wrap">

  <section id="stage-empty" class="stage">
    <div class="empty-card">
      <h1>半導體產業快報閱讀器</h1>
      <p>這個網頁本身沒有任何內容。所有標題、摘要、數據與連結，都是從你提供的 Excel 報告即時解析出來的。</p>
      <p class="muted">把 <code>.xlsx</code> 拖曳到畫面任何位置，或按下方按鈕選擇檔案。檔案只在你的瀏覽器內解析，不會上傳到任何地方。</p>
      <button id="btn-open-2" class="btn primary" type="button">選擇 Excel 檔案</button>
      <p id="empty-hint" class="hint"></p>
    </div>
  </section>

  <section id="stage-report" class="stage" hidden>

    <div class="hero">
      <p id="hero-eyebrow" class="eyebrow">FOUNDRY BRIEF</p>
      <h1 id="rpt-title">—</h1>
      <p id="rpt-sub" class="hero-sub"></p>
      <div id="rpt-stats" class="stats"></div>
      <div id="rpt-mix" class="mix"></div>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab is-on" data-tab="news"  role="tab" aria-selected="true">新聞彙整 <span class="pill" id="tabcount-news"></span></button>
      <button class="tab"       data-tab="data"  role="tab">重點數據 <span class="pill" id="tabcount-data"></span></button>
      <button class="tab"       data-tab="vocab" role="tab">英文字彙 <span class="pill" id="tabcount-vocab"></span></button>
      <button class="tab"       data-tab="notes" role="tab">說明與方法</button>
    </nav>

    <!-- ============ 新聞彙整 ============ -->
    <section id="panel-news" class="panel">
      <div class="filters">
        <div class="select-row">
          <label class="fsel"><span>分類</span><select id="s-cat"></select></label>
          <label class="fsel"><span>日期</span><select id="s-date"></select></label>
          <label class="fsel"><span>主體</span><select id="s-ent"></select></label>
        </div>

        <div class="filter-foot">
          <span id="result-count" class="muted"></span>
          <button id="btn-reset" class="linkbtn" type="button">清除全部篩選</button>
          <span id="en-hint" class="en-hint" hidden></span>
          <button id="btn-all-lang" class="btn lang-all" type="button" data-to="en" hidden>全部切成英文</button>
        </div>
      </div>

      <div id="news-cards" class="cards"></div>
      <p id="news-none" class="none" hidden>沒有符合條件的新聞。</p>
    </section>

    <!-- ============ 重點數據 ============ -->
    <section id="panel-data" class="panel" hidden>
      <div class="filters">
        <div class="select-row">
          <label class="fsel"><span>類別</span><select id="s-dcat"></select></label>
        </div>
      </div>
      <div id="data-grid" class="datagrid"></div>
      <p id="data-none" class="none" hidden>沒有符合條件的數據。</p>
    </section>

    <!-- ============ 英文字彙 ============ -->
    <section id="panel-vocab" class="panel" hidden>
      <div class="filters">
        <div class="select-row">
          <label class="fsel"><span>範圍</span>
            <select id="s-vscope">
              <option value="report">本期新聞的字彙</option>
              <option value="saved">我的單字本（跨期收藏）</option>
            </select>
          </label>
          <label class="fsel"><span>類型</span>
            <select id="s-vtype">
              <option value="">全部字彙</option>
              <option value="fin">只看財經用語</option>
              <option value="general">只看一般字彙</option>
            </select>
          </label>
          <label class="fcheck"><input id="c-vhide" type="checkbox"> 遮住中文（自我測驗，點一下看答案）</label>
        </div>
        <div class="filter-foot">
          <span class="muted">已收藏 <b id="v-saved-count">0</b> 個單字・收藏只存在這台裝置的瀏覽器</span>
        </div>
      </div>
      <div id="vocab-grid" class="vgrid"></div>
      <p id="vocab-none" class="none" hidden></p>
    </section>

    <!-- ============ 說明與方法 ============ -->
    <section id="panel-notes" class="panel" hidden>
      <div id="notes-body" class="notes"></div>
    </section>

  </section>
</main>

<footer class="foot">
  <span id="foot-src" class="muted"></span>
  <span class="muted">資料來源為使用者提供的 Excel 檔；本頁僅作呈現，不構成投資建議。</span>
</footer>

<script src="vendor/xlsx.full.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
