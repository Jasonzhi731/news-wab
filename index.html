<script>
  // 在畫面繪製前套用深淺色並同步 iOS 狀態列色，避免閃白
  (function () {
    var t = null;
    try { t = localStorage.getItem('wr-theme'); } catch (e) {}
    if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    t = t || 'light';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.getElementById('meta-theme');
    if (m) m.setAttribute('content', t === 'dark' ? '#090b10' : '#f6f6f3');
  })();
</script>

<body>

<div id="drop-veil" hidden><div>放開以載入這份 Excel</div></div>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">半導體快報</span>
      <span class="brand-cadence">每 2 日更新</span>
    </a>

    <nav class="appnav" aria-label="切換">
      <a href="./" class="is-on" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8V6Z"/></svg>
        快報
      </a>
      <a href="study/" id="btn-study" title="單字複習：閃卡＋間隔重複">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="14" height="16" rx="2.5"/><path d="M7 5V3.5A1.5 1.5 0 0 1 8.5 2h11A1.5 1.5 0 0 1 21 3.5v13a1.5 1.5 0 0 1-1.5 1.5H17"/><path d="M7 11h6M7 15h4"/></svg>
        單字
      </a>
    </nav>

    <div class="source-picker">
      <label class="sr-only" for="report-select">選擇報告期別</label>
      <select id="report-select" hidden></select>
      <input id="file-input" type="file" accept=".xlsx,.xlsm,.xls" hidden>
    </div>

    <div class="topbar-tools">
      <button id="btn-theme" class="tb-btn" type="button" title="切換深色 / 淺色" aria-label="切換深色 / 淺色">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app" class="wrap">

  <section id="stage-empty" class="stage">
    <div class="empty-card">
      <h1>半導體產業快報閱讀器</h1>
      <p>這個網頁本身沒有任何內容。所有標題、摘要、數據與連結，都是從你提供的 Excel 報告即時解析出來的。</p>
      <p class="muted">把 <code>.xlsx</code> 拖曳到畫面任何位置，或按下方按鈕選擇檔案。檔案只在你的瀏覽器內解析，不會上傳到任何地方。</p>
      <button id="btn-open-2" class="btn primary" type="button">選擇 Excel 檔案</button>
      <p id="empty-hint" class="hint"></p>
    </div>
  </section>

  <section id="stage-report" class="stage" hidden>

    <div class="hero">
      <p id="hero-eyebrow" class="eyebrow">FOUNDRY BRIEF</p>
      <h1 id="rpt-title">—</h1>
      <p id="rpt-sub" class="hero-sub"></p>
      <div id="rpt-stats" class="stats"></div>
      <div id="rpt-mix" class="mix"></div>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab is-on" data-tab="news"  role="tab" aria-selected="true">新聞 <span class="pill" id="tabcount-news"></span></button>
      <button class="tab"       data-tab="data"  role="tab">數據 <span class="pill" id="tabcount-data"></span></button>
      <button class="tab"       data-tab="vocab" role="tab">字彙 <span class="pill" id="tabcount-vocab"></span></button>
      <button class="tab"       data-tab="notes" role="tab">說明</button>
    </nav>

    <!-- ============ 新聞彙整 ============ -->
    <section id="panel-news" class="panel">
      <div class="filters" id="news-filters">
        <div class="filter-bar">
          <div class="filter-bar-left">
            <span id="result-count" class="result-count"></span>
            <button id="btn-filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="news-filter-drawer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
              <span>篩選</span>
              <b id="filter-badge" class="filter-badge" hidden></b>
            </button>
            <button id="btn-reset" class="linkbtn" type="button" hidden>清除</button>
          </div>
          <div class="filter-bar-right">
            <button id="btn-all-lang" class="btn lang-all" type="button" data-to="en" hidden>全部切成英文</button>
          </div>
        </div>

        <div class="filter-drawer" id="news-filter-drawer">
          <div class="select-row">
            <label class="fsel"><span>分類</span><select id="s-cat"></select></label>
            <label class="fsel"><span>日期</span><select id="s-date"></select></label>
            <label class="fsel"><span>主體</span><select id="s-ent"></select></label>
          </div>
        </div>

        <p id="en-hint" class="en-hint" hidden></p>
      </div>

      <div id="news-cards" class="cards"></div>
      <p id="news-none" class="none" hidden>沒有符合條件的新聞。</p>
    </section>

    <!-- ============ 重點數據 ============ -->
    <section id="panel-data" class="panel" hidden>
      <div class="filters filters-simple">
        <div class="select-row">
          <label class="fsel"><span>類別</span><select id="s-dcat"></select></label>
        </div>
      </div>
      <div id="data-grid" class="datagrid"></div>
      <p id="data-none" class="none" hidden>沒有符合條件的數據。</p>
    </section>

    <!-- ============ 英文字彙 ============ -->
    <section id="panel-vocab" class="panel" hidden>
      <div class="filters filters-simple vocab-toolbar">
        <div class="select-row vocab-controls">
          <label class="fsel"><span>類型</span>
            <select id="s-vtype">
              <option value="">全部字彙</option>
              <option value="fin">只看財經用語</option>
              <option value="general">只看一般字彙</option>
            </select>
          </label>
          <label class="fcheck">
            <input id="c-vhide" type="checkbox">
            <span>遮住中文（點一下看答案）</span>
          </label>
        </div>
        <div class="filter-foot">
          <span class="muted">已收藏 <b id="v-saved-count">0</b> 字（<a href="study/#saved">單字本</a>）· <span id="v-sync-note"></span></span>
          <a id="btn-practice" class="btn primary practice-cta" href="study/" hidden>先練這期單字 →</a>
        </div>
      </div>
      <div id="vocab-grid" class="vgrid"></div>
      <p id="vocab-none" class="none" hidden></p>
    </section>

    <!-- ============ 說明與方法 ============ -->
    <section id="panel-notes" class="panel" hidden>
      <div id="notes-body" class="notes"></div>
    </section>

  </section>
</main>

<button id="btn-top" class="fab-top" type="button" aria-label="回到頂部" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
</button>

<footer class="foot">
  <span id="foot-src" class="muted"></span>
  <span class="muted">資料來源為使用者提供的 Excel 檔；本頁僅作呈現，不構成投資建議。</span>
</footer>

    快報

  <a href="study/#home">
    <span class="bn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="14" height="16" rx="2.5"/><path d="M7 5V3.5A1.5 1.5 0 0 1 8.5 2h11A1.5 1.5 0 0 1 21 3.5v13a1.5 1.5 0 0 1-1.5 1.5H17"/><path d="M7 11h6M7 15h4"/></svg></span>
    練習
  </a>
  <a href="study/#browse">
    <span class="bn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg></span>
    單字本
  </a>
  <a href="study/#settings">
    <span class="bn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></span>
    設定
  </a>
</nav>

<script src="vendor/xlsx.full.min.js"></script>
<script src="assets/wordbook.js"></script>
<script src="assets/app.js"></script>
</body>
