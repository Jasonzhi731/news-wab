<meta charset="utf-8">

<title>半導體產業週報</title>
<meta name="description" content="每週更新：晶圓代工新聞與重點數據">

<meta property="og:type" content="website">
<meta property="og:site_name" content="半導體產業週報">
<meta property="og:locale" content="zh_TW">
<meta property="og:url" content="https://jasonzhi731.github.io/news-wab/">
<meta property="og:title" content="半導體產業週報">
<meta property="og:description" content="每週更新：晶圓代工新聞與重點數據">
<meta property="og:image" content="https://jasonzhi731.github.io/news-wab/assets/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="半導體產業週報">
<meta name="twitter:description" content="每週更新：晶圓代工新聞與重點數據">
<meta name="twitter:image" content="https://jasonzhi731.github.io/news-wab/assets/og-cover.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%232c2a26' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div id="drop-veil" hidden><div>放開以載入這份 Excel</div></div>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-text">半導體產業週報</span>
    </div>

    <div class="source-picker">
      <label class="sr-only" for="report-select">選擇週報</label>
      <select id="report-select" hidden></select>
      <input id="file-input" type="file" accept=".xlsx,.xlsm,.xls" hidden>
    </div>

    <div class="topbar-tools">
      <button id="btn-theme" class="btn icon" type="button" title="切換深色 / 淺色">◐</button>
    </div>
  </div>
</header>

<main id="app" class="wrap">

  <section id="stage-empty" class="stage">
    <div class="empty-card">
      <h1>半導體產業週報閱讀器</h1>
      <p>這個網頁本身沒有任何內容。所有標題、摘要、數據與連結，都是從你提供的 Excel 週報即時解析出來的。</p>
      <p class="muted">把 <code>.xlsx</code> 拖曳到畫面任何位置，或按下方按鈕選擇檔案。檔案只在你的瀏覽器內解析，不會上傳到任何地方。</p>
      <button id="btn-open-2" class="btn primary" type="button">選擇 Excel 檔案</button>
      <p id="empty-hint" class="hint"></p>
    </div>
  </section>

  <section id="stage-report" class="stage" hidden>

    <div class="report-head">
      <h1 id="rpt-title">—</h1>
      <p id="rpt-sub" class="muted"></p>
      <div id="rpt-stats" class="stats"></div>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab is-on" data-tab="news"  role="tab">新聞彙整 <span class="pill" id="tabcount-news"></span></button>
      <button class="tab"       data-tab="data"  role="tab">重點數據 <span class="pill" id="tabcount-data"></span></button>
      <button class="tab"       data-tab="notes" role="tab">說明與方法</button>
    </nav>

    <!-- ============ 新聞彙整 ============ -->
    <section id="panel-news" class="panel">
      <div class="filters">
        <div class="select-row">
          <label class="fsel"><span>分類</span><select id="s-cat"></select></label>
          <label class="fsel"><span>日期</span><select id="s-date"></select></label>
          <label class="fsel"><span>主體</span><select id="s-ent"></select></label>
        </div>

        <div class="filter-foot">
          <span id="result-count" class="muted"></span>
          <button id="btn-reset" class="linkbtn" type="button">清除全部篩選</button>
        </div>
      </div>

      <div id="news-cards" class="cards"></div>
      <p id="news-none" class="none" hidden>沒有符合條件的新聞。</p>
    </section>

    <!-- ============ 重點數據 ============ -->
    <section id="panel-data" class="panel" hidden>
      <div class="filters">
        <div class="select-row">
          <label class="fsel"><span>類別</span><select id="s-dcat"></select></label>
        </div>
      </div>
      <div id="data-grid" class="datagrid"></div>
      <p id="data-none" class="none" hidden>沒有符合條件的數據。</p>
    </section>

    <!-- ============ 說明與方法 ============ -->
    <section id="panel-notes" class="panel" hidden>
      <div id="notes-body" class="notes"></div>
    </section>

  </section>
</main>

<footer class="foot">
  <span id="foot-src" class="muted"></span>
  <span class="muted">資料來源為使用者提供的 Excel 檔；本頁僅作呈現，不構成投資建議。</span>
</footer>

<script src="vendor/xlsx.full.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
